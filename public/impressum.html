<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Impressum | Elias Ginter</title>
    <style>
      :root {
        color: #f4f1e8;
        background: #0d0f11;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: #0d0f11;
      }

      a {
        color: inherit;
      }

      .legal-page {
        width: min(880px, calc(100% - 36px));
        margin: 0 auto;
        padding: clamp(72px, 11vw, 130px) 0;
      }

      .back-link,
      .legal-meta,
      h2 {
        color: #6fcabd;
        font-size: 0.78rem;
        font-weight: 760;
        text-transform: uppercase;
      }

      .back-link {
        display: inline-block;
        margin-bottom: clamp(44px, 8vw, 90px);
        text-decoration: none;
      }

      .back-link:hover,
      .back-link:focus-visible,
      .seal a:hover,
      .seal a:focus-visible {
        color: #f06d4f;
      }

      h1 {
        max-width: 760px;
        margin: 0;
        color: #f4f1e8;
        font-size: clamp(2.4rem, 7vw, 5.8rem);
        line-height: 0.9;
        letter-spacing: 0;
      }

      section {
        margin-top: clamp(42px, 7vw, 78px);
      }

      h2 {
        margin: 0 0 14px;
      }

      p {
        max-width: 68ch;
        margin: 0 0 16px;
        color: #b9b5aa;
        font-size: 1rem;
        line-height: 1.65;
      }

      .seal {
        margin-top: clamp(42px, 7vw, 78px);
      }

      .seal a {
        color: #b9b5aa;
        text-decoration: none;
        transition: color 180ms ease;
      }

      .is-loading,
      .is-error {
        color: #b9b5aa;
      }

      .is-error {
        color: #f06d4f;
      }
    </style>
  </head>
  <body>
    <main class="legal-page">
      <a class="back-link" href="/">Zurück zum Portfolio</a>
      <p class="legal-meta" id="imprint-meta">Impressum</p>
      <h1 id="imprint-title">Impressum</h1>
      <p class="is-loading" id="imprint-status">Impressum wird geladen.</p>
      <div id="imprint-sections"></div>
      <noscript>
        <p class="is-error">Bitte aktivieren Sie JavaScript, um das Impressum anzuzeigen.</p>
      </noscript>
    </main>

    <script>
      const statusNode = document.querySelector('#imprint-status')
      const titleNode = document.querySelector('#imprint-title')
      const metaNode = document.querySelector('#imprint-meta')
      const sectionsNode = document.querySelector('#imprint-sections')

      const escapeHtml = (value) =>
        String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;')

      const renderImprint = (imprint) => {
        document.title = `${imprint.title} | Elias Ginter`
        titleNode.textContent = imprint.title
        metaNode.textContent = imprint.meta || 'Impressum'
        statusNode.remove()

        const provider = imprint.provider
        const contact = imprint.contact
        const source = imprint.source

        sectionsNode.innerHTML = `
          <section aria-labelledby="provider-title">
            <h2 id="provider-title">${escapeHtml(provider.title)}</h2>
            <p>
              ${escapeHtml(provider.name)}<br />
              ${escapeHtml(provider.street)}<br />
              ${escapeHtml(`${provider.postalCode} ${provider.city}`)}<br />
              ${escapeHtml(provider.country)}
            </p>
          </section>

          <section aria-labelledby="contact-title">
            <h2 id="contact-title">${escapeHtml(contact.title)}</h2>
            <p>
              E-Mail-Adresse:
              <a href="mailto:${escapeHtml(contact.email)}">${escapeHtml(contact.email)}</a>
            </p>
          </section>

          <p class="seal">
            <a href="${escapeHtml(source.url)}" target="_blank" rel="noopener noreferrer nofollow">
              ${escapeHtml(source.label)}
            </a>
          </p>
        `
      }

      fetch('/data/imprint.json')
        .then((response) => {
          if (!response.ok) {
            throw new Error('Impressumsdaten konnten nicht geladen werden.')
          }

          return response.json()
        })
        .then(renderImprint)
        .catch(() => {
          statusNode.className = 'is-error'
          statusNode.textContent = 'Das Impressum konnte nicht geladen werden.'
        })
    </script>
  </body>
</html>
